[package]
name = "ai-command-center"
version = "0.1.0"
description = "A local-first library for portable AI skills"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "ai_command_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.5" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.6" }
tauri-plugin-log = "2"
serde_yaml = "0.9"
sha2 = "0.10"
walkdir = "2"
zip = "7"
dirs = "6"
dunce = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
